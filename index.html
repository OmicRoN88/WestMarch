<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сота из 7 шестиугольников</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 40px 16px;
    background: #14141f;
    font-family: Arial, sans-serif;
    color: #fff;
  }

  h1 {
    font-size: 1.2rem;
    font-weight: 500;
    opacity: .8;
    margin: 0 0 30px;
  }

  /* ---------- КОНТЕЙНЕР ---------- */
  .hive {
    position: relative;
    /* 
      Задаем радиус (R) - расстояние от центра до вершины.
      Тогда:
      - Ширина (W) = R * √3
      - Высота (H) = 2 * R
      - Апофема (a) = R * (√3 / 2) = W / 2
      
      Расстояние между центрами = 2 * a = W.
    */
    --R: 80px;
    --W: calc(var(--R) * 1.73205); /* √3 */
    --H: calc(var(--R) * 2);
    
    width: calc(var(--W) * 2);
    height: calc(var(--H) * 1.5 + var(--H) * 0.25); /* Высота с запасом */
    margin-bottom: 30px;
  }

  /* ---------- ШЕСТИУГОЛЬНИК ---------- */
  .hex {
    position: absolute;
    width: var(--W);
    height: var(--H);
    /* Pointy-top (вершины вверх/вниз) */
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    border: none;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 0.8rem;
    font-weight: 700;
    line-height: 1.2;
    color: #e8e8f5;
    transition: transform .08s, filter .15s;
    overflow: hidden;
    z-index: 1;
  }

  /* Внешний слой (толстая граница) */
  .hex::before {
    content: "";
    position: absolute;
    inset: 0;
    background: #6a6a8a; /* Цвет границы */
    clip-path: inherit;
    z-index: 0;
  }

  /* Внутренний слой (заливка, создает объем) */
  .hex::after {
    content: "";
    position: absolute;
    inset: 4px; /* Толщина границы */
    background: #24243a; /* Цвет внутри */
    clip-path: inherit;
    z-index: 1;
  }

  /* Текст поверх */
  .hex > span {
    position: relative;
    z-index: 2;
    padding: 0 4px;
    pointer-events: none;
  }

  .hex:hover::after { background: #2f2f4d; }
  .hex:active { transform: scale(0.97); }

  /* ---------- ПОЗИЦИИ ---------- */
  /* 
    Центр центрального шестиугольника находится в точке (W/2, H/2).
    Остальные смещаются на расстояние 2*a = W от центра.
    
    При pointy-top:
    - Горизонтальный шаг = W * 0.5
    - Вертикальный шаг = H * 0.75
  */

  .hex-center {
    left: calc(var(--W) * 0.5);
    top: calc(var(--H) * 0.5);
    z-index: 10;
  }

  /* Верхний */
  .hex-north {
    left: calc(var(--W) * 0.5);
    top: calc(var(--H) * 0.5 - var(--H) * 0.75);
  }
  /* Нижний */
  .hex-south {
    left: calc(var(--W) * 0.5);
    top: calc(var(--H) * 0.5 + var(--H) * 0.75);
  }
  /* Верх-право */
  .hex-north-east {
    left: calc(var(--W) * 0.5 + var(--W) * 0.5);
    top: calc(var(--H) * 0.5 - var(--H) * 0.375);
  }
  /* Низ-право */
  .hex-south-east {
    left: calc(var(--W) * 0.5 + var(--W) * 0.5);
    top: calc(var(--H) * 0.5 + var(--H) * 0.375);
  }
  /* Верх-лево */
  .hex-north-west {
    left: calc(var(--W) * 0.5 - var(--W) * 0.5);
    top: calc(var(--H) * 0.5 - var(--H) * 0.375);
  }
  /* Низ-лево */
  .hex-south-west {
    left: calc(var(--W) * 0.5 - var(--W) * 0.5);
    top: calc(var(--H) * 0.5 + var(--H) * 0.375);
  }

  /* ---------- ИСТОРИЯ НАЖАТИЙ ---------- */
  .history {
    width: min(420px, 92vw);
    background: #1b1b2b;
    border: 1px solid #33334d;
    border-radius: 12px;
    padding: 16px 20px;
    max-height: 300px;
    overflow-y: auto;
  }

  .history h2 {
    margin: 0 0 12px;
    font-size: .9rem;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: #9a9ac0;
    border-bottom: 1px solid #33334d;
    padding-bottom: 8px;
  }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .history-item {
    background: #2b2b40;
    border: 1px solid #44446a;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: .9rem;
    color: #e8e8f5;
    animation: slideIn .2s ease-out;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

  <h1>Выберите направление</h1>

  <div class="hive" id="hive">
    <!-- Центр -->
    <button class="hex hex-center" data-label="Центр"><span>Центр</span></button>

    <!-- 6 соседей -->
    <button class="hex hex-north"      data-label="Север"><span>Север</span></button>
    <button class="hex hex-north-east" data-label="Северо-восток"><span>Северо-восток</span></button>
    <button class="hex hex-south-east" data-label="Юго-восток"><span>Юго-восток</span></button>
    <button class="hex hex-south"      data-label="Юг"><span>Юг</span></button>
    <button class="hex hex-south-west" data-label="Юго-запад"><span>Юго-запад</span></button>
    <button class="hex hex-north-west" data-label="Северо-запад"><span>Северо-запад</span></button>
  </div>

  <div class="history">
    <h2>История нажатий</h2>
    <div class="history-list" id="historyList"></div>
  </div>

<script>
  const list = document.getElementById('historyList');

  document.querySelectorAll('.hex').forEach(btn => {
    btn.addEventListener('click', () => {
      const label = btn.dataset.label || btn.textContent.trim();
      const item = document.createElement('div');
      item.className = 'history-item';
      item.textContent = label;
      list.appendChild(item);
      item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
  });
</script>

</body>
</html>
