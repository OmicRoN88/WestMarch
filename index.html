<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шестиугольная карта</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 40px 16px;
    background: #14141f;
    font-family: Arial, sans-serif;
    color: #fff;
  }

  h1 {
    font-size: 1.2rem;
    font-weight: 500;
    opacity: .8;
    margin: 0 0 30px;
  }

  /* ---------- КОНТЕЙНЕР ---------- */
  .hive {
    position: relative;
    /* Размеры шестиугольника: W — ширина, H — высота (H = W * 1.1547) */
    --w: 120px;
    --h: 138.56px;
    /* Контейнер должен вмещать все 7 фигур:
       ширина = 2 * W (два шестиугольника в ряд по горизонтали)
       высота = 2 * H (два по вертикали) */
    width: calc(var(--w) * 2);
    height: calc(var(--h) * 2);
    /* Убираем overflow, чтобы ничего не обрезалось */
    margin-bottom: 30px;
  }

  /* ---------- БАЗОВЫЙ ШЕСТИУГОЛЬНИК ---------- */
  .hex {
    position: absolute;
    width: var(--w);
    height: var(--h);
    /* Правильный шестиугольник с вершиной вверх */
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    border: none;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 0.8rem;
    font-weight: 700;
    line-height: 1.2;
    color: #e8e8f5;
    transition: transform .08s, filter .15s;
    overflow: hidden;
    z-index: 1;
  }

  /* Внешний слой (толстая граница) */
  .hex::before {
    content: "";
    position: absolute;
    inset: 0;
    background: #6a6a8a;
    clip-path: inherit;
    z-index: 0;
  }

  /* Внутренний слой (заливка, чуть темнее) */
  .hex::after {
    content: "";
    position: absolute;
    inset: 5px; /* Толщина границы */
    background: #24243a;
    clip-path: inherit;
    z-index: 1;
  }

  /* Текст поверх */
  .hex > span {
    position: relative;
    z-index: 2;
    padding: 0 6px;
    pointer-events: none;
  }

  .hex:hover::after { background: #2f2f4d; }
  .hex:active { transform: scale(0.97); }

  /* ---------- ПОЗИЦИИ (ТОЧНЫЙ РАСЧЁТ) ---------- */
  /* 
     Чтобы грани идеально совпадали, используем следующие смещения:
     - По горизонтали: 0.5 * W
     - По вертикали:   0.375 * H
     
     Для правильного шестиугольника (H = W * 1.1547):
     шаг по вертикали = 0.75 * H
     шаг по горизонтали = 0.5 * W
     
     Центр находится в координатах: left = 0.5 * W, top = 0.5 * H
  */

  .hex-center {
    left: calc(var(--w) * 0.5);
    top: calc(var(--h) * 0.5);
    z-index: 10; /* Центр поверх остальных */
  }

  .hex-north {
    left: calc(var(--w) * 0.5);
    top: calc(var(--h) * 0.5 - var(--h) * 0.75);
  }
  .hex-south {
    left: calc(var(--w) * 0.5);
    top: calc(var(--h) * 0.5 + var(--h) * 0.75);
  }
  .hex-north-east {
    left: calc(var(--w) * 0.5 + var(--w) * 0.5);
    top: calc(var(--h) * 0.5 - var(--h) * 0.375);
  }
  .hex-north-west {
    left: calc(var(--w) * 0.5 - var(--w) * 0.5);
    top: calc(var(--h) * 0.5 - var(--h) * 0.375);
  }
  .hex-south-east {
    left: calc(var(--w) * 0.5 + var(--w) * 0.5);
    top: calc(var(--h) * 0.5 + var(--h) * 0.375);
  }
  .hex-south-west {
    left: calc(var(--w) * 0.5 - var(--w) * 0.5);
    top: calc(var(--h) * 0.5 + var(--h) * 0.375);
  }

  /* ---------- ИСТОРИЯ НАЖАТИЙ (СВЕРХУ ВНИЗ) ---------- */
  .history {
    width: min(420px, 92vw);
    background: #1b1b2b;
    border: 1px solid #33334d;
    border-radius: 12px;
    padding: 16px 20px;
    max-height: 300px;
    overflow-y: auto;
  }

  .history h2 {
    margin: 0 0 12px;
    font-size: .9rem;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: #9a9ac0;
    border-bottom: 1px solid #33334d;
    padding-bottom: 8px;
  }

  .history-list {
    display: flex;
    flex-direction: column; /* Сверху вниз */
    gap: 8px;
  }

  .history-item {
    background: #2b2b40;
    border: 1px solid #44446a;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: .9rem;
    color: #e8e8f5;
    animation: slideIn .2s ease-out;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

  <h1>Выберите направление</h1>

  <div class="hive" id="hive">
    <!-- Центр -->
    <button class="hex hex-center" data-label="Центр"><span>Центр</span></button>

    <!-- 6 соседей -->
    <button class="hex hex-north"      data-label="Север"><span>Север</span></button>
    <button class="hex hex-north-east" data-label="Северо-восток"><span>Северо-восток</span></button>
    <button class="hex hex-south-east" data-label="Юго-восток"><span>Юго-восток</span></button>
    <button class="hex hex-south"      data-label="Юг"><span>Юг</span></button>
    <button class="hex hex-south-west" data-label="Юго-запад"><span>Юго-запад</span></button>
    <button class="hex hex-north-west" data-label="Северо-запад"><span>Северо-запад</span></button>
  </div>

  <div class="history">
    <h2>История нажатий</h2>
    <div class="history-list" id="historyList"></div>
  </div>

<script>
  const list = document.getElementById('historyList');

  document.querySelectorAll('.hex').forEach(btn => {
    btn.addEventListener('click', () => {
      const label = btn.dataset.label || btn.textContent.trim();
      const item = document.createElement('div');
      item.className = 'history-item';
      item.textContent = label;

      // Добавляем в конец списка (сверху вниз)
      list.appendChild(item);

      // Автоматическая прокрутка вниз к новому элементу
      item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
  });
</script>

</body>
</html>
